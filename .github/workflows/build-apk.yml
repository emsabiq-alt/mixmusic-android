name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build EmsaMusic Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/EmsaMusic-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmsaMusic-Android-APK
          path: output/EmsaMusic-Android.apk

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/EmsaMusic-Android.apk
          name: EmsaMusic Android ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
